<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品图册</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
  <style>:root{--bg:#1A1A2E}.viewer-shell{grid-template-rows:auto 1fr;min-height:0}.stage{display:block;min-height:0;padding:18px 0}.image-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.5) transparent}.image-scroll img{display:block;width:100%;height:auto;max-width:none;max-height:none;margin:0 auto;border-radius:10px;box-shadow:0 25px 70px #000}.mini-map{position:absolute;left:clamp(20px,3vw,40px);bottom:clamp(20px,3vw,40px);z-index:2;width:150px;max-height:118px;padding:4px;border-radius:5px;background:rgba(11,11,25,.8);border:1px solid rgba(255,255,255,.3);box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:ns-resize;overflow:hidden;touch-action:none}.mini-map img{display:block;width:100%;height:auto;max-height:108px;object-fit:contain}.mini-map-viewport{position:absolute;left:4px;right:4px;top:4px;height:25px;border:2px solid #ffcc4e;background:rgba(255,204,78,.12);box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none}.filmstrip,.counter,.arrow{display:none}.preview-tabs{display:flex;height:54px;margin:-1px -1px 8px;overflow:hidden;border-radius:12px 12px 7px 7px;background:rgba(255,255,255,.1)}.preview-tabs button{flex:1;border:0;background:transparent;color:rgba(255,255,255,.58);font:700 15px 'Noto Sans SC',sans-serif;cursor:pointer;transition:color .2s,background .25s}.preview-tabs button.active{color:#191925;background:linear-gradient(105deg,#fff,#f0f0f3);box-shadow:0 2px 13px rgba(0,0,0,.12)}.preview-tabs button:disabled{cursor:default;opacity:.36}</style>
  <style>.preview-tabs{height:64px;margin:-1px -1px 8px;padding:0;gap:0;background:#fff;border-radius:30px 30px 0 0;overflow:hidden}.preview-tabs button{position:relative;color:#000;background:#fff;border-radius:0;font-size:16px}.preview-tabs button.active{z-index:1;flex:0 0 45%;color:#1b1922;background:#ffc966;box-shadow:none}.preview-tabs button:not(.active){flex:1}.preview-tabs button.active[data-variant="PP"]::after,.preview-tabs button.active[data-variant="A+"]::after{content:"";position:absolute;bottom:0;width:40px;height:64px;pointer-events:none}.preview-tabs button.active[data-variant="PP"]::after{right:-40px;background:radial-gradient(ellipse 40px 64px at 0 100%,#ffc966 99%,transparent 100%)}.preview-tabs button.active[data-variant="A+"]::after{left:-40px;background:radial-gradient(ellipse 40px 64px at 100% 100%,#ffc966 99%,transparent 100%)}.preview-tabs button:only-child{flex:1;border-radius:30px 30px 0 0}.preview-tabs button[hidden]{display:none}</style>
  <style>.preview-tabs{position:relative;background:#fff}.preview-tabs .tab-shape{display:none;position:absolute;inset:0;width:100%;height:100%;fill:#ffc966;pointer-events:none}.preview-tabs.pp-active .tab-shape-pp,.preview-tabs.ap-active .tab-shape-ap{display:block}.preview-tabs button{position:relative;z-index:1;flex:1!important;color:#000;background:transparent!important;border-radius:0}.preview-tabs button.active{color:#1b1922;background:transparent!important}.bottom-preview-tabs{margin:8px -1px -1px;border-radius:0 0 30px 30px}.bottom-preview-tabs .tab-shape path{transform:scaleY(-1);transform-box:fill-box;transform-origin:center}.hover-preview.show .preview-tabs.pp-active .tab-shape-pp,.hover-preview.show .preview-tabs.ap-active .tab-shape-ap,.hover-preview.show .preview-tabs button.active{animation:tab-block-nudge 1.2s ease-in-out infinite}.preview-tabs button.active::after{display:none!important}.preview-tabs.single .tab-shape{display:none!important}.preview-tabs.single button.active{background:#ffc966!important}.hover-preview.show .preview-tabs.single button.active{animation:none}@keyframes tab-block-nudge{0%{transform:translateX(0)}4%{transform:translateX(-6px)}8%{transform:translateX(6px)}12%{transform:translateX(-4px)}16%,100%{transform:translateX(0)}}@media (prefers-reduced-motion:reduce){.preview-tabs .tab-shape,.preview-tabs button.active{animation:none}}</style>
  <style>.set-head h1{font-size:26px;letter-spacing:-.04em}.module-banner{margin:0 0 28px;border-radius:14px;overflow:hidden;background:#222233;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 26px rgba(0,0,0,.18)}.module-banner img{display:block;width:100%;height:auto;aspect-ratio:4.25/1;object-fit:cover}@media(max-width:600px){.set-head h1{font-size:22px}}</style>
</head>
<body>
  <main id="gallery" aria-label="作品图册"></main>
  <div class="hover-preview" id="hover-preview" aria-hidden="true"><div class="hover-card"><div class="preview-tabs" id="preview-tabs"><svg class="tab-shape tab-shape-pp" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H45C49 0 47 100 53 100H0Z"/></svg><svg class="tab-shape tab-shape-ap" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0H55C51 0 53 100 47 100H100Z"/></svg><button data-variant="PP">主副图</button><button data-variant="A+">A+</button></div><img id="hover-image" alt="快速预览" /><div class="hover-details"><span id="hover-type"></span><strong id="hover-title"></strong><button id="hover-open">查看原图&nbsp; ↗</button></div><div class="preview-tabs bottom-preview-tabs" id="bottom-preview-tabs"><svg class="tab-shape tab-shape-pp" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H45C49 0 47 100 53 100H0Z"/></svg><svg class="tab-shape tab-shape-ap" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M100 0H55C51 0 53 100 47 100H100Z"/></svg><button data-variant="PP">主副图</button><button data-variant="A+">A+</button></div></div></div>
  <dialog id="viewer" aria-label="图片预览"><div class="viewer-shell"><button class="close" aria-label="关闭预览">×</button><div class="viewer-top"><p id="modal-kicker"></p><h2 id="modal-title"></h2></div><div class="stage"><div class="image-scroll" id="image-scroll"><img id="hero-image" alt="作品预览" /></div></div><div class="mini-map" id="mini-map" aria-label="大图位置导航"><img id="mini-map-image" alt="当前图片缩略图" /><div class="mini-map-viewport" id="mini-map-viewport"></div></div></div></dialog>
  <script src="app.js?v=28"></script>
</body>
</html>
